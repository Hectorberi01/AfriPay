---
# ── Rôle docker — Installation de Docker CE + Docker Compose V2 ─

- name: Vérifier si Docker CE est déjà installé
  ansible.builtin.command: docker --version
  register: docker_already_installed
  changed_when: false
  failed_when: false

- name: Supprimer les anciennes versions de Docker (seulement si Docker CE absent)
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
    state: absent
  when: docker_already_installed.rc != 0

- name: Nettoyer les entrées Docker conflictuelles
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/trusted.gpg.d/docker.gpg
    - /etc/apt/keyrings/docker.gpg

- name: Créer le répertoire des keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG officielle Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Ajouter le dépôt Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    filename: docker

- name: Installer Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  notify: Démarrer Docker

- name: Activer Docker au démarrage
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Installer le module Python docker (via apt, PEP 668)
  ansible.builtin.apt:
    name:
      - python3-docker
    state: present

- name: Configurer le daemon Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "5"
        },
        "live-restore": true,
        "userland-proxy": false,
        "storage-driver": "overlay2"
      }
    mode: "0644"
  notify: Redémarrer Docker

- name: Créer le réseau Docker afripay-net
  community.docker.docker_network:
    name: afripay-net
    driver: bridge
    state: present

- name: Vérifier la version Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Afficher la version installée
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout }}"