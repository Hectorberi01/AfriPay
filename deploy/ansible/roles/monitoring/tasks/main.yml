---
# ── Rôle monitoring — Prometheus + Grafana + Alertmanager ──────

- name: Créer le répertoire de supervision
  ansible.builtin.file:
    path: "{{ app_dir }}/monitoring/{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
  loop:
    - ""
    - prometheus
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - alertmanager

- name: Déployer la configuration Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ app_dir }}/monitoring/prometheus/prometheus.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"

- name: Déployer les règles d'alerte
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: "{{ app_dir }}/monitoring/prometheus/alert-rules.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"

- name: Déployer la configuration Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ app_dir }}/monitoring/alertmanager/alertmanager.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  no_log: true

- name: Déployer la datasource Grafana
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ app_dir }}/monitoring/grafana/provisioning/datasources/prometheus.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"

- name: Déployer docker-compose.monitoring.yml
  ansible.builtin.template:
    src: docker-compose.monitoring.yml.j2
    dest: "{{ app_dir }}/monitoring/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"

- name: Démarrer la stack de supervision
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/monitoring"
    state: present