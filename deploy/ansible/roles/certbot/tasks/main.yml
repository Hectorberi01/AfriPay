---
# ── Rôle certbot — Certificats SSL Let's Encrypt ───────────────

- name: Installer Certbot et le plugin Nginx
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Créer le répertoire webroot pour ACME
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    mode: "0755"

- name: Obtenir le certificat pour l'API
  ansible.builtin.command: >
    certbot certonly
    --webroot
    --webroot-path /var/www/certbot
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    --domains {{ domain_api }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain_api }}/fullchain.pem"
  notify: Recharger Nginx

- name: Obtenir le certificat pour le monitoring
  ansible.builtin.command: >
    certbot certonly
    --webroot
    --webroot-path /var/www/certbot
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    --domains {{ domain_metrics }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain_metrics }}/fullchain.pem"
  notify: Recharger Nginx

- name: Configurer le renouvellement automatique (cron)
  ansible.builtin.cron:
    name: "Certbot renew"
    minute: "0"
    hour: "3"
    weekday: "1"
    job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
    user: root