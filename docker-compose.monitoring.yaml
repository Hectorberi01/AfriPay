version: "3.9"

# ═══════════════════════════════════════════════════════════════
# AfriPay — Monitoring Stack (Prometheus + Grafana)
# Usage : docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# ═══════════════════════════════════════════════════════════════

services:

  # Prometheus 
  prometheus:
    image: prom/prometheus:latest
    container_name: afripay-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - afripay-net

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: afripay-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         https://metrics.afripay.io
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - afripay-net

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: afripay-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - afripay-net

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local