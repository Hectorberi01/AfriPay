name: AfriPay CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Tag Docker à restaurer (ex: sha-abc1234)"
        required: true
        type: string

env:
  REGISTRY:       ghcr.io
  IMAGE_API:      ghcr.io/${{ github.repository }}/afripay-api
  IMAGE_FRONT:    ghcr.io/${{ github.repository }}/afripay-front
  DOTNET_VERSION: "9.0.x"
  ANSIBLE_DIR:    deploy/ansible

# ════════════════════════════════════════════════════════════════
jobs:

# ── JOB 1 : Tests unitaires ─────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       afripay_test
          POSTGRES_USER:     afripay
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurer les dépendances
        run: dotnet restore AfriPay.sln

      - name: Build
        run: dotnet build AfriPay.sln -c Release --no-restore

      - name: Tests unitaires
        run: |
          dotnet test tests/AfriPay.Tests/AfriPay.Tests.csproj \
            -c Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Publier les résultats de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: coverage/*.trx
          reporter: dotnet-trx

      - name: Upload couverture de code
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

# ── JOB 2 : Build & Push images Docker ─────────────────────────
  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculer le tag d'image (SHA court)
        id: image_tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Métadonnées image API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push image API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Métadonnées image Frontend
        id: meta-front
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONT }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push image Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.front
          push: true
          tags: ${{ steps.meta-front.outputs.tags }}
          labels: ${{ steps.meta-front.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ── JOB 3 : Déploiement Staging (develop) ──────────────────────
  deploy-staging:
    name: Deploy Staging (Ansible)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-api.afripay.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Ansible + collections
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible==10.*
          ansible-galaxy collection install \
            community.docker community.general ansible.posix

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/afripay_prod
          chmod 600 ~/.ssh/afripay_prod
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Écrire le mot de passe Ansible Vault
        run: |
          mkdir -p ~/.ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > ~/.ansible/vault_pass
          chmod 600 ~/.ansible/vault_pass

      - name: Déployer sur staging
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          PROD_HOST:         ${{ secrets.STAGING_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG:         ${{ needs.build.outputs.image_tag }}
        run: |
          ansible-playbook playbooks/deploy.yml \
            --inventory inventory/staging \
            --extra-vars "image_tag=${{ needs.build.outputs.image_tag }}" \
            --vault-password-file ~/.ansible/vault_pass \
            --diff

      - name: Notification Slack (staging)
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '🚨' }} *Staging* — `${{ needs.build.outputs.image_tag }}` — ${{ job.status == 'success' && 'déployé' || 'ECHEC' }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Voir les logs>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# ── JOB 4 : Déploiement Production (main) ──────────────────────
  deploy-production:
    name: Deploy Production (Ansible)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.afripay.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Ansible + collections
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible==10.*
          ansible-galaxy collection install \
            community.docker community.general ansible.posix

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/afripay_prod
          chmod 600 ~/.ssh/afripay_prod
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Écrire le mot de passe Ansible Vault
        run: |
          mkdir -p ~/.ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > ~/.ansible/vault_pass
          chmod 600 ~/.ansible/vault_pass

      - name: Vérification syntaxe (dry-run)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          PROD_HOST:         ${{ secrets.PROD_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG:         ${{ needs.build.outputs.image_tag }}
        run: |
          ansible-playbook playbooks/deploy.yml \
            --inventory inventory/production \
            --extra-vars "image_tag=${{ needs.build.outputs.image_tag }}" \
            --vault-password-file ~/.ansible/vault_pass \
            --syntax-check

      - name: Déployer en production
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          PROD_HOST:         ${{ secrets.PROD_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG:         ${{ needs.build.outputs.image_tag }}
        run: |
          ansible-playbook playbooks/deploy.yml \
            --inventory inventory/production \
            --extra-vars "image_tag=${{ needs.build.outputs.image_tag }}" \
            --vault-password-file ~/.ansible/vault_pass \
            --diff

      - name: Notification succès
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "✅ *Production* — `${{ needs.build.outputs.image_tag }}` déployé\n*Auteur :* ${{ github.actor }} | *Commit :* `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Voir les logs>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notification échec
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "🚨 *Production DEPLOY FAILED* — `${{ github.sha }}`\n*Auteur :* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Voir les logs>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# ── JOB 5 : Rollback Manuel (workflow_dispatch) ─────────────────
  rollback:
    name: Rollback Production (Manuel)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Ansible + collections
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible==10.*
          ansible-galaxy collection install \
            community.docker community.general ansible.posix

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/afripay_prod
          chmod 600 ~/.ssh/afripay_prod
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Écrire le mot de passe Ansible Vault
        run: |
          mkdir -p ~/.ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > ~/.ansible/vault_pass
          chmod 600 ~/.ansible/vault_pass

      - name: Rollback vers ${{ github.event.inputs.rollback_tag }}
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          PROD_HOST:         ${{ secrets.PROD_HOST }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ansible-playbook playbooks/rollback.yml \
            --inventory inventory/production \
            --extra-vars "rollback_tag=${{ github.event.inputs.rollback_tag }}" \
            --vault-password-file ~/.ansible/vault_pass

      - name: Notification rollback
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '⏪' || '🚨' }} *Rollback Production* — vers `${{ github.event.inputs.rollback_tag }}` — ${{ job.status == 'success' && 'OK' || 'ECHEC' }}\n*Déclenché par :* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Voir les logs>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}