---
#  Variables globales — Production AfriPay
#  Les valeurs sensibles sont dans vault.yml (chiffré Ansible Vault)

# Application
app_name: afripay
app_dir: /opt/afripay
app_user: afripay
app_group: afripay
app_port: 8080

# Images Docker
ghcr_registry: ghcr.io
ghcr_repo: "{{ lookup('env', 'GITHUB_REPOSITORY') | default('your-org/afripay') }}"
image_api: "{{ ghcr_registry }}/{{ ghcr_repo | lower }}/afripay-api"
image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest') }}"

# Domaines 
domain_api:     api.afripay.io
domain_metrics: metrics.afripay.io
domain_docs:    docs.afripay.io

# Ports internes 
port_api:           8080
port_postgres_live: 5433
port_postgres_sand: 5434
port_redis:         6379
port_prometheus:    9090
port_grafana:       3001
port_alertmanager:  9093

# PostgreSQL
postgres_version: "16"
postgres_live_db: afripay_live
postgres_sand_db: afripay_sandbox
postgres_user:    afripay

# Redis
redis_version:    "7"
redis_maxmemory:  256mb

# SSL / Certbot
certbot_email:     devops@afripay.io
certbot_domains:
  - "{{ domain_api }}"
  - "{{ domain_metrics }}"

# Monitoring 
prometheus_retention: 30d
grafana_root_url: "https://{{ domain_metrics }}"

# Système 
timezone: Africa/Abidjan
swap_size_mb: 2048
ufw_allowed_ports:
  - 22
  - 80
  - 443